<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZENBOX // REALISTIC PHYSICS LAB</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }
        header {
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            z-index: 10;
        }
        .logo {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .mode-toggle-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 9px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-toggle-btn:active {
            background: rgba(56, 189, 248, 0.4);
            color: #fff;
        }

        /* --- BAR KAWALAN MASA (SANDBOX) --- */
        .time-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }
        .time-btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            font-size: 9px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        /* --- SUB-DOCK UNTUK PARTICLE LAB --- */
        .particle-sub-dock {
            display: none;
            justify-content: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(9, 13, 22, 0.95);
            border-bottom: 1px solid #1e293b;
            z-index: 10;
        }
        .sub-mode-btn {
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 5px 10px;
            font-size: 9px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .sub-mode-btn.active {
            background: #38bdf8;
            color: #030712;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none;
            background: #000000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .toolbar {
            background: rgba(15, 23, 42, 0.95);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            max-height: 170px;
            overflow-y: auto;
            z-index: 10;
        }
        .toolbar::-webkit-scrollbar { width: 4px; }
        .toolbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        
        .tool-btn {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(4px);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 8px 12px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            touch-action: manipulation;
            transition: all 0.2s ease;
        }
        .tool-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .action-row {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 4px;
        }
        .action-row button {
            flex: 1;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px;
            font-weight: bold;
            font-size: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-row button:active {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo" id="logoTitle">ZENBOX</div>
            <button class="mode-toggle-btn" id="modeBtn" onclick="toggleGameMode()">Ubah ke Particle Lab</button>
        </header>

        <!-- BAR MOD WAKTU (SANDBOX) -->
        <div class="time-bar" id="timeBarContainer">
            <button class="time-btn" onclick="setTimeMode('day', this)">☀️ Siang</button>
            <button class="time-btn" onclick="setTimeMode('sunset', this)">🌇 Petang</button>
            <button class="time-btn active" onclick="setTimeMode('night', this)">🌙 Malam</button>
        </div>

        <!-- SUB-DOCK UNTUK PARTICLE LAB -->
        <div class="particle-sub-dock" id="particleSubDock">
            <button class="sub-mode-btn active" onclick="setParticleMode('fluid', this)">NEON FLUID</button>
            <button class="sub-mode-btn" onclick="setParticleMode('spark', this)">GRAVITY SPARK</button>
            <button class="sub-mode-btn" onclick="setParticleMode('blackhole', this)">BLACK HOLE</button>
        </div>
        
        <div class="canvas-area" id="canvasArea">
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- TOOLBAR SANDBOX -->
        <div class="toolbar" id="toolbar">
            <button class="tool-btn active" data-element="sand">Pasir</button>
            <button class="tool-btn" data-element="water">Air</button>
            <button class="tool-btn" data-element="oil">Minyak</button>
            <button class="tool-btn" data-element="tree">Pokok 🌲</button>
            <button class="tool-btn" data-element="lava">Lava</button>
            <button class="tool-btn" data-element="stone">Batu</button>
            <button class="tool-btn" data-element="fire">Api</button>
            <button class="tool-btn" data-element="gunpowder">Gunpowder</button>
            <button class="tool-btn" data-element="acid">Asid</button>
            <button class="tool-btn" data-element="wall">Dinding</button>
            <button class="tool-btn" data-element="eraser">Pemadam</button>
            <div class="action-row">
                <button onclick="clearGrid()">PADAM SEMUA (RESET)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const CELL_SIZE = 4;
        let cols, rows;
        let grid = [];
        let gameMode = 'sandbox'; 
        
        let currentParticleMode = 'fluid'; 
        let particles = [];
        let touchX = canvas.width / 2;
        let touchY = canvas.height / 2;
        let isTouching = false;

        let timeMode = 'night';
        let stars = [];

        function initStars() {
            stars = [];
            for (let i = 0; i < 70; i++) {
                stars.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * (window.innerHeight * 0.6),
                    size: Math.random() * 2 + 1,
                    alpha: Math.random()
                });
            }
        }

        function setTimeMode(mode, btn) {
            timeMode = mode;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleGameMode() {
            initAudio();
            playUiSound();
            if (gameMode === 'sandbox') {
                gameMode = 'particlelab';
                document.getElementById('modeBtn').innerText = "Game Sandbox";
                document.getElementById('logoTitle').innerText = "PARTICLE LAB";
                document.getElementById('timeBarContainer').style.display = 'none';
                document.getElementById('toolbar').style.display = 'none';
                document.getElementById('particleSubDock').style.display = 'flex';
                particles = [];
            } else {
                gameMode = 'sandbox';
                document.getElementById('modeBtn').innerText = "Ubah ke Particle Lab";
                document.getElementById('logoTitle').innerText = "ZENBOX";
                document.getElementById('timeBarContainer').style.display = 'flex';
                document.getElementById('toolbar').style.display = 'flex';
                document.getElementById('particleSubDock').style.display = 'none';
            }
        }

        function setParticleMode(mode, btn) {
            initAudio();
            playUiSound();
            currentParticleMode = mode;
            document.querySelectorAll('.sub-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            particles = [];
        }

        let audioCtx = null;
        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playUiSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } catch(e){}
        }

        function playParticleSound(mode) {
            try {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (mode === 'fluid') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (mode === 'spark') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800 + Math.random() * 400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (mode === 'blackhole') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch(e){}
        }

        function playSandboxSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(15, now + 0.7);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
                    osc.start(now);
                    osc.stop(now + 0.7);
                } else if (type === 'hiss') {
                    let bufSize = audioCtx.sampleRate * 0.2;
                    let buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                    let data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                    let noise = audioCtx.createBufferSource();
                    noise.buffer = buf;
                    let nGain = audioCtx.createGain();
                    nGain.gain.setValueAtTime(0.15, now);
                    nGain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    noise.connect(nGain);
                    nGain.connect(audioCtx.destination);
                    noise.start(now);
                } else if (type === 'draw') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.04);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                }
            } catch(e){}
        }

        function resizeCanvas() {
            const area = document.getElementById('canvasArea');
            canvas.width = area.clientWidth;
            canvas.height = area.clientHeight;
            cols = Math.floor(canvas.width / CELL_SIZE);
            rows = Math.floor(canvas.height / CELL_SIZE);
            initGrid();
            initStars();
        }

        function initGrid() {
            let newGrid = [];
            for (let y = 0; y < rows; y++) {
                let row = [];
                for (let x = 0; x < cols; x++) {
                    row.push({ type: 'empty', color: '#020617', life: 0 });
                }
                newGrid.push(row);
            }
            grid = newGrid;
        }

        function clearGrid() {
            if (gameMode === 'sandbox') {
                initGrid();
            } else {
                particles = [];
            }
            playSandboxSound('explosion');
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let currentElement = 'sand';
        
        document.querySelectorAll('.tool-btn[data-element]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                initAudio();
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentElement = e.target.getAttribute('data-element');
                playSandboxSound('draw');
            });
        });

        class Particle {
            constructor(x, y, mode) {
                this.x = x;
                this.y = y;
                this.mode = mode;
                
                if (mode === 'fluid') {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                    this.size = Math.random() * 3 + 1;
                    this.color = `hsl(${Math.random() * 60 + 180}, 100%, 60%)`;
                    this.friction = 0.94;
                } else if (mode === 'spark') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 2.5 + 1;
                    this.color = `hsl(${Math.random() * 50 + 15}, 100%, 55%)`;
                    this.friction = 0.96;
                    this.gravity = 0.15;
                } else if (mode === 'blackhole') {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 150 + 50;
                    this.x = touchX + Math.cos(angle) * dist;
                    this.y = touchY + Math.sin(angle) * dist;
                    this.vx = 0;
                    this.vy = 0;
                    this.size = Math.random() * 2 + 1;
                    this.color = `hsl(${Math.random() * 60 + 270}, 100%, 70%)`;
                }
            }

            update() {
                if (this.mode === 'fluid') {
                    let dx = touchX - this.x;
                    let dy = touchY - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 140 && isTouching) {
                        this.vx += dx * 0.025;
                        this.vy += dy * 0.025;
                    }
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                    this.x += this.vx;
                    this.y += this.vy;
                } else if (this.mode === 'spark') {
                    this.vy += this.gravity;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                    this.x += this.vx;
                    this.y += this.vy;
                } else if (this.mode === 'blackhole') {
                    let dx = touchX - this.x;
                    let dy = touchY - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 5) {
                        this.vx += (dx / dist) * 0.9;
                        this.vy += (dy / dist) * 0.9;
